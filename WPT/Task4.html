<!DOCTYPE html>
<html>
    <head>
        <title>Hide Headings</title>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </head>

    <body>
        <h1>Heading 1</h1>
        <h2>Heading 2</h2>
        <h3>Heading 3</h3>

        <p id="locate"></p>

        <script>
            $(document).ready(function(){

                $("h1, h2, h3").click(function(){
                    $(this).hide();
                });

                $(document).mousemove(function(task){
                    $("#locate").text("X: " + task.pageX + ", Y: " + task.pageY);
                });

            });
        </script>
    </body>
</html>
