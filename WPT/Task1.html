<!DOCTYPE html>
<html>
    <title>Get Single Element</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function(){
    // Select the second paragraph (index starts from 0)
    $("p").eq(2).css("color","red");
});
</script>
</head>
<body>

<p>Paragraph 1</p>
<p>Paragraph 2</p>
<p>Paragraph 3</p>

</body>
</html>
